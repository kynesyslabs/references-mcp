version: '3.8'

services:
  mcp-server:
    build: .
    ports:
      - "${MCP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - MCP_PORT=3000
    volumes:
      - ./demosdk-api-ref:/app/demosdk-api-ref:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s